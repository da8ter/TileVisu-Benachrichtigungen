<script src="/icons.js" crossorigin="anonymous"></script>
<style>
  :root {
    --mt: 12px; --ms: 12px; --mb: 12px; --sbw: 6px;
    --akzent: var(--accent-color, #00cdab);
    --fg: var(--content-color, #1d1d1f);
    --surface: color-mix(in srgb, var(--fg) 7%, transparent);
    --border: color-mix(in srgb, var(--fg) 14%, transparent);
    --muted: color-mix(in srgb, var(--fg) 55%, transparent);
    --sb-pad: max(0px, calc((var(--ms) - var(--sbw)) / 2));
  }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { box-sizing: border-box; height: 100%; display: flex; flex-direction: column;
          padding: var(--mt) var(--sb-pad) var(--mb) var(--ms); }
  #bar { display: flex; align-items: center; gap: 8px; margin: 0 calc(var(--sb-pad) + var(--sbw)) 8px 0; min-height: 30px; }
  #count { flex: 1; color: var(--muted); font-size: 13px; }
  .icon-btn { border: 0; background: var(--surface); color: var(--fg); width: 32px; height: 32px; border-radius: 10px;
              cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  .icon-btn:hover { background: var(--border); }
  #list { flex: 1 1 auto; min-height: 0; overflow-y: scroll; padding-right: var(--sb-pad);
          display: flex; flex-direction: column; gap: 6px; }
  #list::-webkit-scrollbar { width: var(--sbw); }
  #list::-webkit-scrollbar-track { background: transparent; }
  #list::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--akzent) 70%, transparent); border-radius: 999px; }
  @supports not selector(::-webkit-scrollbar) { #list { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--akzent) 70%, transparent) transparent; } }
  /* flex-shrink 0: in der scrollenden Spalte würden die Zeilen sonst gestaucht statt gescrollt. */
  .row { position: relative; flex-shrink: 0; display: flex; align-items: flex-start; gap: 10px; padding: 9px 8px 9px 9px;
         background: var(--surface); border-radius: 12px; cursor: pointer; }
  .row:hover { background: var(--border); }
  .ico { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center;
         justify-content: center; font-size: 17px; overflow: hidden; }
  .ico img { width: 100%; height: 100%; object-fit: cover; }
  .main { flex: 1; min-width: 0; }
  .t { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.unread .t::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                          background: var(--akzent); margin-left: 6px; vertical-align: middle; }
  .x { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
       white-space: pre-wrap; overflow-wrap: anywhere; }
  .side { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .del { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 4px; border-radius: 8px; }
  .del:hover { color: var(--fg); background: var(--border); }
  .empty { margin: auto; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .empty i { font-size: 28px; }
  /* 1x1: Glocke, Zahl der ungelesenen, Titel der neuesten (Modus nach verfügbarem Platz, siehe modus()). */
  #mini { display: none; height: 100%; align-items: center; gap: 10px; cursor: pointer; min-width: 0; }
  body.mode-mini #bar, body.mode-mini #list { display: none; }
  body.mode-mini #mini { display: flex; }
  #mini .glocke { flex: 0 0 auto; font-size: 26px; color: var(--muted); display: flex; }
  #mini .zahl { flex: 0 0 auto; font-size: 30px; font-weight: 800; line-height: 1; color: var(--muted); }
  #mini.hat .glocke, #mini.hat .zahl { color: var(--akzent); }
  #mini .neu { flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; color: var(--muted); overflow: hidden;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  body.mini-schmal #mini .neu { display: none; }
  body.mini-schmal #mini { justify-content: center; }
  /* 2x2: schlanke Zeilen ohne Text und Löschknopf */
  body.mode-compact #bar { min-height: 22px; margin-bottom: 4px; }
  body.mode-compact #clear { display: none; }
  body.mode-compact #list { gap: 4px; }
  body.mode-compact .row { padding: 5px 6px; gap: 8px; align-items: center; border-radius: 10px; }
  body.mode-compact .ico { flex-basis: 26px; width: 26px; height: 26px; border-radius: 8px; font-size: 13px; }
  body.mode-compact .x, body.mode-compact .del { display: none; }
  body.mode-compact .t { font-size: 13px; }
  body.mode-compact .time { font-size: 11px; }
</style>
<div id="wrap">
  <div id="mini" role="button" tabindex="0"><span class="glocke"><i class="fa-light fa-bell"></i></span><span class="zahl"></span><span class="neu"></span></div>
  <div id="bar"><span id="count"></span><button id="clear" class="icon-btn" type="button"><i class="fa-light fa-trash-can"></i></button></div>
  <div id="list"></div>
</div>
<script>
(function () {
  'use strict';
  var INIT = /*NTF_INIT*/null;
  if (!INIT) return;
  var state = INIT.state, L = INIT.labels;
  var OWNER = 'ntf-' + INIT.instance, SEEN = 'ntf.seen.' + INIT.instance;
  var LEVEL = { info: '#3498fa', success: '#34c759', warning: '#ff9500', alarm: '#ff3b30' };
  var listEl = document.getElementById('list'), countEl = document.getElementById('count'), clearBtn = document.getElementById('clear');
  var erster = true;

  // Ränder von Symcon (Kachelname und Vollbild-Symbol liegen oben über der Kachel).
  (function () {
    var q = new URLSearchParams(location.search), st = document.documentElement.style;
    [['margintop', '--mt'], ['marginside', '--ms'], ['marginbottom', '--mb']].forEach(function (m) {
      var v = parseFloat(q.get(m[0]));
      if (isFinite(v) && v >= 0) st.setProperty(m[1], v + 'px');
    });
  })();

  function lsGet(k) { try { var v = localStorage.getItem(k); return v === null ? null : parseInt(v, 10) || 0; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* privat */ } }

  // ── Overlay: Code im Hauptfenster, ohne Hauptfenster in der Kachel selbst ─────
  function hauptfenster() {
    try { if (window.top !== window && window.top.document && window.top.document.body) return window.top; } catch (e) { /* fremd */ }
    return null;
  }
  var ziel = hauptfenster() || window;
  // Mindestfassung des Overlay-Codes; eine ältere im Hauptfenster wird durch Nachladen ersetzt.
  var OVERLAY_VERSION = 10;
  var warten = [], laedt = false;
  function overlay(cb) {
    var a = ziel.__symconNotify;
    if (a && a.version >= OVERLAY_VERSION) { werkzeugIcons(a); cb(a); return; }
    if (!state.config.overlayJs) return;
    warten.push(cb);
    if (laedt) return;
    laedt = true;
    var doc = ziel.document, s = doc.createElement('script');
    s.src = state.config.overlayJs;
    s.onload = s.onerror = function () {
      // Handler sofort lösen: das Element lebt im Hauptfenster weiter, die Kachel nicht.
      s.onload = s.onerror = null;
      s.remove();
      laedt = false;
      var api = ziel.__symconNotify, w = warten;
      warten = [];
      if (api && api.version >= OVERLAY_VERSION) { werkzeugIcons(api); w.forEach(function (f) { f(api); }); }
    };
    (doc.head || doc.documentElement).appendChild(s);
  }

  function farbe(name, rueckfall) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || rueckfall;
  }
  function thema() {
    return { card: farbe('--card-color', '#ffffff'), content: farbe('--content-color', '#1d1d1f'), accent: farbe('--accent-color', '#00cdab') };
  }
  function iconName(m) { return m.icon || (state.config.levelIcons || {})[m.level] || 'bell'; }
  function iconSvg(name) {
    try {
      var FA = window.FontAwesome, def = FA && FA.findIconDefinition({ prefix: 'fal', iconName: name });
      return def ? FA.icon(def).html.join('') : '';
    } catch (e) { return ''; }
  }
  function nutzlast(m, sofort) {
    return JSON.stringify({ owner: OWNER, msg: m, theme: thema(), labels: L, icon: iconSvg(iconName(m)), force: !!sofort,
      hook: state.config.hookBase || '', inline: ziel === window });
  }
  // Icons der Bedienelemente im Overlay (das Hauptfenster hat kein Font Awesome): einmal je Kachel liefern.
  var werkzeugGeliefert = false;
  function werkzeugIcons(api) {
    if (werkzeugGeliefert) return;
    var svg = iconSvg('trash-can');
    if (svg) { api.icon('trash-can', svg); werkzeugGeliefert = true; }
  }
  function iconsMelden(api) {
    state.messages.forEach(function (m) { var n = iconName(m), s = iconSvg(n); if (s) api.icon(n, s); });
  }

  /* Neue Overlay-Nachrichten. Jeder Browser merkt sich die höchste gezeigte Folgenummer; beim ersten
     Laden erscheint nur, was jünger als zwei Minuten ist — sonst spränge Altes nach jedem Seitenwechsel auf. */
  function neueZeigen() {
    if (!state.config.overlayJs) return;
    if (state.config.everywhere) {
      overlay(function (api) {
        iconsMelden(api);
        api.agent(JSON.stringify({ owner: OWNER, pollUrl: state.config.hookBase + '&k=poll', hook: state.config.hookBase, intervalMs: state.config.pollMs,
          seenKey: SEEN, theme: thema(), labels: L }));
        api.pollNow(OWNER);
      });
      erster = false;
      return;
    }
    if (ziel.__symconNotify && ziel.__symconNotify.stopAgent) ziel.__symconNotify.stopAgent(OWNER);
    var gesehen = lsGet(SEEN), jetzt = Date.now() / 1000;
    var neu = state.messages.filter(function (m) {
      return (m.overlay || m.sound) && (gesehen === null || m.seq > gesehen) && (!erster || m.time >= jetzt - 120);
    }).sort(function (a, b) { return a.seq - b.seq; });
    lsSet(SEEN, Math.max(gesehen || 0, state.seq));
    erster = false;
    if (neu.length) overlay(function (api) {
      neu.forEach(function (m) {
        if (m.overlay) api.show(nutzlast(m, false));
        else if (api.play) api.play(m.sound); // ohne Overlay: nur der Ton
      });
    });
  }

  // ── Liste ───────────────────────────────────────────────────────────────────
  function zeit(t) {
    var s = Math.max(0, Date.now() / 1000 - t);
    if (s < 60) return L.now;
    if (s < 3600) return L.min.replace('%1', String(Math.floor(s / 60)));
    if (s < 86400) return L.hour.replace('%1', String(Math.floor(s / 3600)));
    return new Date(t * 1000).toLocaleDateString(undefined, { day: '2-digit', month: '2-digit' });
  }

  function zeile(m) {
    var row = document.createElement('div');
    row.className = 'row' + (m.read ? '' : ' unread');
    var farbeLevel = /^#[0-9a-f]{6}$/i.test(m.color || '') ? m.color : (LEVEL[m.level] || LEVEL.info);
    var ico = document.createElement('div');
    ico.className = 'ico';
    if (m.image) {
      var img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = m.image;
      ico.appendChild(img);
    } else {
      ico.style.color = farbeLevel;
      ico.style.background = farbeLevel + '22';
      var i = document.createElement('i');
      i.className = 'fa-light fa-' + iconName(m);
      ico.appendChild(i);
    }
    var main = document.createElement('div');
    main.className = 'main';
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = m.title || m.text || '';
    var x = document.createElement('div');
    x.className = 'x';
    x.textContent = m.title ? m.text : '';
    main.appendChild(t);
    if (x.textContent) main.appendChild(x);
    var side = document.createElement('div');
    side.className = 'side';
    var tm = document.createElement('span');
    tm.className = 'time';
    tm.dataset.t = String(m.time);
    tm.textContent = zeit(m.time);
    var del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.title = L.delete;
    del.textContent = '×';
    del.addEventListener('click', function (ev) { ev.stopPropagation(); requestAction('Delete', m.id); });
    side.appendChild(tm); side.appendChild(del);
    row.appendChild(ico); row.appendChild(main); row.appendChild(side);
    row.addEventListener('click', function () {
      overlay(function (api) { api.show(nutzlast(m, true)); });
      if (!m.read) requestAction('Read', m.id);
    });
    return row;
  }

  // Ansicht nach Platz: 1x1 (mini), 2x2 (compact), größer (voll). Gemessen am Inhaltsbereich ohne Symcons Ränder.
  var miniEl = document.getElementById('mini');
  function modus() {
    var cs = getComputedStyle(document.documentElement);
    var mt = parseFloat(cs.getPropertyValue('--mt')) || 0, mb = parseFloat(cs.getPropertyValue('--mb')) || 0, ms = parseFloat(cs.getPropertyValue('--ms')) || 0;
    var h = window.innerHeight - mt - mb, w = window.innerWidth - 2 * ms;
    var m = (h < 100 || w < 200) ? 'mini' : (h < 250 || w < 380) ? 'compact' : 'full';
    document.body.classList.toggle('mode-mini', m === 'mini');
    document.body.classList.toggle('mode-compact', m === 'compact');
    document.body.classList.toggle('mini-schmal', m === 'mini' && w < 170);
  }
  window.addEventListener('resize', modus);
  function neuesteUngelesen() {
    return state.messages.filter(function (m) { return !m.read; })[0] || state.messages[0] || null;
  }
  function miniZeichnen() {
    var m = neuesteUngelesen();
    miniEl.classList.toggle('hat', state.unread > 0);
    miniEl.querySelector('.zahl').textContent = String(state.unread);
    // Font Awesome ersetzt das <i> durch ein <svg>: das Icon deshalb jedes Mal neu setzen statt es zu suchen.
    var glocke = miniEl.querySelector('.glocke'), gi = document.createElement('i');
    gi.className = 'fa-light ' + (state.unread > 0 ? 'fa-bell-ring' : 'fa-bell');
    glocke.textContent = '';
    glocke.appendChild(gi);
    miniEl.querySelector('.neu').textContent = m ? (m.title || m.text || '') : L.empty;
    miniEl.title = m ? (m.title || '') : L.empty;
  }
  function miniOeffnen() {
    var m = neuesteUngelesen();
    if (!m) return;
    overlay(function (api) { api.show(nutzlast(m, true)); });
    if (!m.read) requestAction('Read', m.id);
  }
  miniEl.addEventListener('click', miniOeffnen);
  miniEl.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); miniOeffnen(); } });

  function zeichnen() {
    miniZeichnen();
    listEl.textContent = '';
    var n = state.messages.length;
    countEl.textContent = !n ? '' : state.unread > 0 ? L.unread.replace('%1', String(state.unread))
      : n === 1 ? L.one : L.total.replace('%1', String(n));
    clearBtn.style.visibility = state.messages.length ? '' : 'hidden';
    if (!state.messages.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      var i = document.createElement('i');
      i.className = 'fa-light fa-bell';
      var s = document.createElement('span');
      s.textContent = L.empty;
      e.appendChild(i); e.appendChild(s);
      listEl.appendChild(e);
      return;
    }
    state.messages.forEach(function (m) { listEl.appendChild(zeile(m)); });
  }

  clearBtn.title = L.clear;
  clearBtn.addEventListener('click', function () {
    var ok = true;
    try { ok = window.confirm(L.confirmClear); } catch (e) { ok = true; }
    if (ok) requestAction('Clear', '');
  });

  window.handleMessage = function (data) {
    if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { return; } }
    if (!data || data.type !== 'state' || !Array.isArray(data.messages)) return;
    state = data;
    zeichnen();
    neueZeigen();
  };

  setInterval(function () {
    Array.prototype.forEach.call(document.querySelectorAll('.time'), function (el) { el.textContent = zeit(+el.dataset.t); });
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) requestAction('GetState', JSON.stringify({ hash: state.hash }));
  });
  // Modus „nur Seite der Kachel": Overlays verschwinden mit der Kachel.
  window.addEventListener('pagehide', function () {
    var api = ziel.__symconNotify;
    if (api && ziel !== window && !state.config.everywhere) api.closeOwner(OWNER);
  });

  modus();
  zeichnen();
  neueZeigen();
})();
</script>
